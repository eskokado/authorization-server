spring:
  management:
    info:
      env.enabled: true
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always
  info:
    app.name: AlgaShop Authorization Server
  session:
    store-type: jdbc
  datasource:
    url: jdbc:postgresql://localhost:5432/authorization_server
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration # inativo temporario,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/authorization_server
  security:
    oauth2:
      authorizationserver:
        issuer: http://algashop-authorization-server:8081
        client:
          algashop-test-client:
            registration:
              client-id: algashop-test
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}testing123"
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - invoices:write
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - shipping-costs:preview
                - users:read
                - users:write
            token:
              access-token-time-to-live: 15m
              access-token-format: self-contained # JWT
              # access-token-format: reference # Opaco
          algashop-ordering-service-client:
            registration:
              client-id: algashop-ordering-service
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}secret123"
              scopes:
                - products:read
            token:
              access-token-time-to-live: 5m
              access-token-format: self-contained # JWT
          algashop-ecommerce-web-client:
            registration:
              client-id: algashop-ecommerce-web
              client-secret: "{noop}ecommerce123"
              client-name: AlgaShop Ecommerce
              authorization-grant-types:
                - authorization_code
                - refresh_token
              client-authentication-methods:
                - client_secret_basic
              redirect-uris:
                - http://algashop-ecommerce:9080/login/oauth2/code/algashop-ecommerce-web
                - https://oauth.pstmn.io/v1/callback
              post-logout-redirect-uris:
                - http://algashop-ecommerce:9080?logout-success
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - invoices:write
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - shipping-costs:preview
                - users:read
                - users:write
                - openid
            require-authorization-consent: true
            require-proof-key: false #PKCE
            token:
              access-token-time-to-live: 5m
              authorization-code-time-to-live: 10m
              refresh-token-time-to-live: 1h
              reuse-refresh-tokens: false
          algashop-ecommerce-m2m-client:
            registration:
              client-id: algashop-ecommerce-m2m
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}m2m123"
              scopes:
                - products:read
                - categories:read
                - customers:write
            token:
              access-token-time-to-live: 15m

logging:
  level:
    org.springframework.security: TRACE
