server:
  port: 0

spring:
  application:
    name: authorization-server
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      parameterstore:
        enabled: false
      secretsmanager:
        enabled: false
  mail:
    host: localhost
    port: 3025
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8081
        client:
          test-client:
            registration:
              client-id: test-client
              client-secret: "{noop}secret"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - openid

eureka:
  client:
    enabled: false

management:
  health:
    mail:
      enabled: false

algashop:
  user-account:
    token:
      activation-ttl: PT24H
      password-reset-ttl: PT2H
    mail:
      from: no-reply@algashop.local
      password-change-url: http://localhost:3000/change-password
  security:
    defaultRedirectUri: http://localhost:3000
    cors:
      allowedOrigins:
        - http://localhost:3000
    cookie:
      secure: false
      sameSite: Lax
      domainName: localhost
    csp:
      policyDirectives: "default-src 'self'"
